# Hyprlock —— 与桌面统一的暖色磨砂锁屏
# 安装: sudo pacman -S hyprlock

general {
    hide_cursor = true
}

background {
    monitor           = eDP-1
    path              = /home/MC/Downloads/2.jpg
    blur_passes       = 3
    blur_size         = 8
    noise             = 0.02
    contrast          = 0.95
    brightness        = 0.75
    vibrancy          = 0.20
    vibrancy_darkness = 0.10
}

# 时间
label {
    monitor     = eDP-1
    text        = $TIME
    color       = rgba(205, 214, 244, 1.0)
    font_size   = 88
    font_family = JetBrainsMono Nerd Font
    position    = 0, 20
    halign      = center
    valign      = center
}

# 日期
label {
    monitor     = eDP-1
    text        = $DATE
    color       = rgba(166, 173, 200, 1.0)
    font_size   = 20
    font_family = JetBrainsMono Nerd Font
    position    = 0, -70
    halign      = center
    valign      = center
}

# 输入框
input-field {
    monitor       = eDP-1
    size          = 260, 48
    outline_thickness = 2
    dots_size     = 0.26
    dots_spacing  = 0.30
    dots_center   = true
    rounding      = 14
    outer_color   = rgba(250, 179, 135, 0.9)
    inner_color   = rgba(30, 30, 46, 0.65)
    font_color    = rgba(205, 214, 244, 1.0)
    placeholder_text = 输入密码…
    fail_text     = 密码错误
    position      = 0, -180
    halign        = center
    valign        = center
}

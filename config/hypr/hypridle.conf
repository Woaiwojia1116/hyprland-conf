# hypridle —— 空闲 5 分钟自动锁屏，不挂起
# 安装: sudo pacman -S hypridle
# 立即启动: hyprctl dispatch exec hypridle

general {
    # 避免重复启动多个 hyprlock 实例
    lock_cmd = pidof hyprlock || hyprlock
}

# 空闲 5 分钟锁定屏幕（300 秒，按需修改）
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 可选：锁屏后 1 分钟关闭屏幕省电，动一下鼠标/键盘即亮
# listener {
#     timeout    = 360
#     on-timeout = hyprctl dispatch dpms off

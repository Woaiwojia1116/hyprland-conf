# ============================================================
# Kitty 终端配置 — Catppuccin Mocha
# 环境：Arch Linux + Hyprland + Bash
# 备份见：kitty.conf.bak-*
# ============================================================

# ---------------- 字体 ----------------
# 与 fc-list 中的实际字体名一致（FiraCode 未安装，改用 JetBrainsMono）
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         14.0
# 保留编程连字：->  !=  >= 等
disable_ligatures never

# ---------------- 窗口 ----------------
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size    yes
initial_window_width    120c
initial_window_height   34c
window_padding_width    10
placement_strategy      center
# 分屏边框（外框圆角/描边由 Hyprland 统一负责）
window_border_width     1pt
active_border_color     #cba6f7
inactive_border_color   #313244
# 非焦点分屏文字略微变暗，聚焦感更强
inactive_text_alpha     0.80

# ---------------- 背景 ----------------
# 纯色背景，不加载任何图片（启动时不显示图片）
background_image        none
background_opacity      1.0
dynamic_background_opacity no
# 透明/模糊交给 Hyprland（terminal-glass 规则：0.96 / 0.90 + blur）
# 因此这里不再设置 background_blur，避免叠乘

# ---------------- 光标 ----------------
cursor_shape             block
cursor                   #f5e0dc
cursor_text_color        #1e1e2e
cursor_blink_interval    0.5
# 输入时闪烁，静置 15 秒后保持常亮
cursor_stop_blinking_after 15
# Neovide 风格拖尾（仅方块光标生效）
cursor_trail             3
cursor_trail_decay       0.1 0.4
cursor_trail_start_threshold 2
# Bash 集成默认会把光标改成闪烁竖线（DECSCUSR 5），这里关闭，
# 让 cursor_shape 的方块 + 拖尾真正生效
shell_integration no-cursor

# ---------------- 标签栏 ----------------
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_align             left
tab_bar_background        #181825
tab_title_template        " {index}: {title} "
active_tab_title_template " {index}: {title} "
active_tab_font_style     bold
inactive_tab_font_style   normal
active_tab_foreground     #1e1e2e
active_tab_background     #cba6f7
inactive_tab_foreground   #a6adc8
inactive_tab_background   #313244

# ---------------- 滚动 ----------------
scrollback_lines         10000
wheel_scroll_multiplier  5.0

# ---------------- 交互 ----------------
enable_audio_bell         no
visual_bell_duration      0.0
copy_on_select            clipboard
mouse_hide_wait           3.0
detect_urls               yes
url_style                 curly
url_color                 #89b4fa
allow_remote_control      yes

# ---------------- 快捷键 ----------------
# 重新加载配置
map ctrl+shift+f5  load_config_file
# 字体缩放
map ctrl+plus      change_font_size all +1.0
map ctrl+minus     change_font_size all -1.0
map ctrl+0         change_font_size all 0
# 分屏（继承当前目录）
map ctrl+shift+enter      launch --location=hsplit --cwd=current
map ctrl+shift+backslash  launch --location=vsplit --cwd=current
# 分屏间移动（Vim 风格）
map ctrl+shift+h  neighboring_window left
map ctrl+shift+j  neighboring_window down
map ctrl+shift+k  neighboring_window up
map ctrl+shift+l  neighboring_window right

# ============================================================
# 配色 — Catppuccin Mocha（完整 16 色）
